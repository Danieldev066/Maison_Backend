name: Backend CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          SECRET_KEY: test-key-with-at-least-32-characters-1234567890
          DATABASE_URL: sqlite:///./ci.db
